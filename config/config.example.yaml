ziniao:
  # 紫鸟浏览器配置。
  browser:
    version: v6
    client_path: ""
    webdriver_path: ""
    socket_port: 16851
    # 店铺运行期间每隔多少秒用只读请求维持并检查紫鸟 IPC，建议保持 60 秒。
    ipc_keepalive_seconds: 60
  # 推荐在环境变量中填写，不要提交真实账号和密码。
  user_info:
    company: ""
    username: ""
    password: ""

# 启动后常驻后台，每天等待到 07:00 执行；--run-now 会立即执行第一轮并继续常驻。
schedule:
  enabled: true
  run_time: "07:00"
  timezone: "Asia/Shanghai"
  # false=执行完成后等待第二天继续运行，true=执行一轮后退出（适合外部任务计划程序）。
  run_once: false

feishu:
  base_url: "https://open.feishu.cn"
  app_id: ""
  app_secret: ""
  bitable:
    # 四张多维表属于同一个应用时填写；各表独立时保持为空。
    default_app_token: ""
    control:
      app_token: ""
      table_id: ""
    data_tables:
      tiktok:
        app_token: ""
        table_id: ""
      shopee:
        app_token: ""
        table_id: ""
      mercado:
        app_token: ""
        table_id: ""
    control_fields:
      store_name: "店铺名"
      recipient: "推送人员"
      switch: "开关"
      platform: "平台"
    data_fields:
      store_name: "店铺名"
      collected_at: "采集时间"
      metric: "指标"
      value: "数值"
      raw_data: "原始数据"
  spreadsheets:
    tiktok:
      token: ""
      sheet_id: ""
      range: ""
    shopee:
      token: ""
      sheet_id: ""
      range: ""
    mercado:
      token: ""
      sheet_id: ""
      range: ""
  robot:
    # 当前使用 open_id 定向发送，因此下面字典的值填写以 ou_ 开头的 open_id。
    receive_id_type: "open_id"
    # 姓名只用于方便识别接收人；全部店铺结束后会向每个 open_id 发送 DeepSeek 分析结果。
    summary_recipients: {}
    # 填写示例：summary_recipients: {"张三": "ou_xxxxxxxxxxxxx", "李四": "ou_yyyyyyyyyyyyy"}
    webhook_url: ""
    sign_secret: ""

# DeepSeek 在全部店铺处理完成后分析 ALL_info，并把返回内容推送给 summary_recipients。
deepseek:
  enabled: true
  # 可直接填写，也可通过环境变量 DEEPSEEK_API_KEY 注入。
  api_key: ""
  model_name: "deepseek-v4-flash"
  base_url: "https://api.deepseek.com/v1"
  temperature: 0.7
  max_tokens: 2000
  timeout_seconds: 120
  # 首次分析失败后最多重试 5 次，即最多请求 6 次；HTTP、响应解析和空内容都会触发重试。
  retry_times: 5
  # 相邻两次 DeepSeek 请求之间的等待秒数。
  retry_interval_seconds: 3
  system_prompt: |
    你是中国一个专业南美跨境电商公司总经理，擅长店铺的数据分析。严格按照用户要求处理输入文本。
    输出尽量简洁，不要多余废话。这分别是 TikTok、Shopee、美客多巴西跨境电商后台的广告数据和店铺概览数据，帮我总结分析这些店铺。

data:
  retention_days: 90
  request_timeout_seconds: 30
  output_dir: "data"

platforms:
  tiktok:
    crawler: "tiktok.TK_auto:TiktokAuto"
    captcha:
      # 登录后出现物体匹配验证码时，是否启用验证码识别接口。
      enabled: true
      # 每张验证码图片请求一次；接口 data.res_str 返回两个图片像素坐标，直接点击，不平均、不四舍五入。
      # 可在这里填写，也可以通过环境变量 TIKTOK_CAPTCHA_API_KEY 注入。
      api_key: ""
      # 验证码识别类型，当前相同形状物体验证码使用 38。
      verify_idf_id: "38"
      # 验证码接口的识别说明参数，按 captcha_tiktok.py 发送；不是旧视觉模型提示词。
      words: "Select 2 objects that are the same shape"
      endpoint: "http://220.167.181.200:9009/openapi/verify_code_identify/"
      request_timeout_seconds: 60
  shopee:
    crawler: "shopee.SP_auto:ShopeeAuto"
  mercado:
    crawler: "mercado.MKD_auto:MercadoAuto"
  meicado:
    crawler: "mercado.MKD_auto:MercadoAuto"

task:
  amazon: []
